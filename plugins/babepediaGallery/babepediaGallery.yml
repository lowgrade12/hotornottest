name: Babepedia Gallery
description: Automatically download performer images scraped from Babepedia (https://www.babepedia.com). Add the [Stashbox Performer Gallery] tag to a performer and it will create a gallery of images scraped from that performer's Babepedia page. Apply the tag [Set Profile Image] to an image to set it as the profile image of that performer. Note you will need to configure the download path and add this as a path under settings > library
version: 0.4
url: https://github.com/lowgrade12/myplugins
exec:
  - python
  - "{pluginDir}/babepediaGallery.py"
interface: raw
settings:
  path:
    displayName: Download parent folder
    description: Download location for files, note this should be in a different folder to stash and in a folder covered by stash. You may need to create a new library path to cover this directory.
    type: STRING
  removeTagAfterDownload:
    displayName: Remove tag after galleries downloaded
    description: When enabled, removes the [Stashbox Performer Gallery] tag from performers after their galleries have been downloaded and linked
    type: BOOLEAN

hooks:
  - name: modify performer
    description: Download gallery on performer update if the [Stashbox Performer Gallery] tag is applied
    triggeredBy:
      - Performer.Update.Post
  - name: image add
    description: Add images
    triggeredBy:
      - Image.Create.Post
  - name: set profile images
    description: Set profile images by adding the [Set Profile Image] tag to the image, there must be exactly 1 performer tagged on the image.
    triggeredBy:
      - Image.Update.Post

tasks:
  - name: "Process Performers"
    description: Fetch performer images from Babepedia for performers with the [Stashbox Performer Gallery] tag
    defaultArgs:
      mode: processPerformers
  - name: "relink missing images"
    description: reprocess missing images
    defaultArgs:
      mode: processImages
